findings:
- id: PF-1
  origin: planning
  review: PR1
  round: 1
  severity: blocking
  summary: The oracle-envelope semantics are still a proposal rather than an accepted specification.
  detail: The plan’s Risks and Planning gaps and the contract’s contract_requirements all say that using
    the existing case.stub_case fixture as the canonical narration envelope is a load-bearing assumption
    needing owner confirmation. The proposed implementation nevertheless commits to that interpretation,
    while also leaving two materially different acquisition methods open (“running the stub emitter once
    or reading the fixture”). If the intended isolation uses a live fetch or a different canonical fixture,
    narration execution, transcript attribution, grading, and tests would all be built against the wrong
    input. The oracle source and acquisition method must be fixed before implementation.
  required_change: null
  evidence: null
  references:
  - Plan — Proposed changes
  - Plan — Risks, assumptions and gaps
  - Plan — Planning gaps
  - Acceptance contract — observable_behaviour
  - Acceptance contract — contract_requirements
  - Acceptance contract — semantic
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-25T14:13:27Z'
  disposition:
    kind: remediate
    rationale: 'Plan: owner confirmation C1 recorded; oracle acquisition fixed to the stub emitter via
      case.stub_case, emitter real refused for narration, ineligible cases excluded loudly.'
    authorised_by: shane
    at: '2026-09-25T14:25:12Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-25T14:25:12Z'
  remediation:
    round: 2
    state: resolved
    rationale: 'The delta records owner confirmation of the oracle-envelope interpretation and fixes a
      single acquisition method: `build_client("stub", case.stub_case)` using the recorded request. It
      expressly rejects both the real emitter and direct fixture reading, and defines loud handling for
      ineligible cases.'
- id: PF-2
  origin: planning
  review: PR1
  round: 1
  severity: blocking
  summary: “CredentialsRejected writes no report” conflicts with checkpoint-after-every-completed-trial
    semantics.
  detail: The contract requires an atomic checkpoint after every trial, but also says that CredentialsRejected
    at the first occurrence causes “no report” to be written. If credentials are rejected after one or
    more completed trials, a report/checkpoint has already been written. The supplied material does not
    distinguish a checkpoint from a final report or say whether an existing checkpoint must be retained,
    removed, or ignored. These requirements cannot both be accepted literally, and removal would also
    threaten resumability. Define the expected artifact state for rejection before any trial and after
    prior completed trials.
  required_change: null
  evidence: null
  references:
  - Acceptance contract — observable_behaviour
  - Acceptance contract — failure_behaviour
  - Acceptance contract — deterministic/live-tier-deterministic-tests
  - Plan — Bounded objective
  - Plan — Verification approach
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-25T14:13:27Z'
  disposition:
    kind: remediate
    rationale: 'Plan: no final report on rejection; existing checkpoint kept unchanged and resumable;
      truthful exit message; both cases tested per stage.'
    authorised_by: shane
    at: '2026-09-25T14:25:12Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-25T14:25:12Z'
  remediation:
    round: 2
    state: resolved
    rationale: 'The delta distinguishes final reports from resumable checkpoints and defines both artifact
      states: rejection before any completed trial leaves no report or transcript, while later rejection
      preserves the last running checkpoint byte-for-byte without writing a final report. It also specifies
      truthful messaging and tests both cases for every stage.'
- id: PF-3
  origin: planning
  review: PR1
  round: 1
  severity: material
  summary: The defining narration-isolation test injects an intent into a stage that is specified not
    to execute or consume intent.
  detail: The contract requires comparing narration trials given correct and deliberately wrong scripted
    intents, while the same contract defines narration as build_answer_view(oracle envelope) followed
    directly by narrate, with no intent stage or intent input. No supplied interface explains how such
    an intent can be fed without adding a test-only or production dependency. As written, the check is
    either vacuous or unimplementable. Replace it with a falsifiable test that perturbs upstream intent-capable
    inputs while asserting identical narration inputs/results, or directly assert that interpret_intent
    and evidence fetch are never called and that grading reads the oracle envelope.
  required_change: null
  evidence: null
  references:
  - Acceptance contract — observable_behaviour
  - Acceptance contract — semantic
  - Plan — Verification approach
  - Plan — Proposed changes
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-25T14:13:27Z'
  disposition:
    kind: remediate
    rationale: 'Plan: isolation test replaced by intent-perturbation equality plus spies proving interpret_intent
      and evidence fetch are never called in narration.'
    authorised_by: shane
    at: '2026-09-25T14:25:13Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-25T14:25:13Z'
  remediation:
    round: 2
    state: resolved
    rationale: The delta replaces the impossible intent injection with a falsifiable perturbation test
      and direct spies. It requires identical narration inputs, outputs, and grades across models with
      different latent intents, while proving that `interpret_intent` and evidence fetching are never
      invoked and that graders use the oracle envelope.
- id: PF-4
  origin: planning
  review: PR1
  round: 1
  severity: material
  summary: The collect-only acceptance check does not prove that live tests remain excluded from the default
    gate.
  detail: The live-eval-collect-only command proves only that tests can be collected. It does not verify
    that the new tests carry the live marker or that the default pytest invocation excludes them, despite
    the expected result claiming both. A missing marker could make credentialed tests enter the PR gate
    while both collect-only and collection itself still succeed. Add a deterministic marker/exclusion
    assertion or a collection check demonstrating that the default gate does not select these tests.
  required_change: null
  evidence: null
  references:
  - Acceptance contract — deterministic/live-eval-collect-only
  - Acceptance contract — compatibility
  - Plan — Verification approach
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-25T14:13:27Z'
  disposition:
    kind: remediate
    rationale: 'Plan: unit test in the full-test-suite gate proves default options select zero live tests
      and -m live selects all of them.'
    authorised_by: shane
    at: '2026-09-25T14:25:13Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-25T14:25:13Z'
  remediation:
    round: 2
    state: resolved
    rationale: The delta adds a deterministic unit assertion that repository-default collection selects
      zero live tests and `-m live` selects every test in the live file. This directly detects either
      accidental default-gate inclusion or a missing live marker.
