contract_version: 0.1.0
artifact_version: 1
work_item: 20260908T113155
observable_behaviour:
  - "`evals/live.py` executes a genuinely isolated intent stage: when invoked with `--stage intent`, it runs only Stage 1 (`harness.intent.interpret_intent`, NL -> StructuredIntent) with no evidence fetch and no rendering, and grades it with a decision-scoped grader set only."
  - "`evals/live.py` executes a genuinely isolated narration stage: when invoked with `--stage narration`, it builds an AnswerView via `harness.answer_view.build_answer_view` over a fixed/oracle envelope per case (NOT the model's own fetched envelope), calls `harness.narration.narrate`, and grades it with rendering/grounding/limitations graders only, so narration quality is scored independently of intent quality."
  - "`--stage end-to-end` and `--stage` omitted continue to run the existing full trial (`ask(build_agent(), deps, phrasing)`) with the full grader set, unchanged except for the k=1 constraint already enforced for end-to-end."
  - "The `stage` value now reaches execution and grading (threaded through `run_suite` -> `run_trial`), rather than only affecting report metadata and k/pressure validation as it does today."
  - "A narration-stage trial fed a deliberately wrong scripted intent still passes/fails purely on the oracle envelope's rendering, proving isolation of narration from intent."
  - "Quota-aware interruption, resumability and completed-trial aggregation are preserved for every stage: QuotaExceeded -> SuiteInterruption(kind=quota_exhausted) -> break; CredentialsRejected stops with no report; checkpoint-after-every-trial with atomic .tmp+.replace; --resume skips completed trials via _trial_key/done; pass@k and pass^k computed over completed trials only."
required_outputs:
  - repo: k-12Harness
    path: evals/live.py
    reason: "Thread `stage` into run_suite/run_trial and branch execution for intent-only, narration-only, and end-to-end trials while preserving quota/resume/checkpoint/accounting semantics."
  - repo: k-12Harness
    path: evals/graders.py
    reason: "Add stage-scoped grader selection (INTENT_GRADERS, NARRATION_GRADERS from the existing decision/rendering partition) and a grade_case(case, record, stage=None) dispatch; stage=None preserves GRADERS_BY_DIRECTION exactly."
  - repo: k-12Harness
    path: evals/schema.py
    reason: "Contingent minimal stage discriminator so an intent-only run (no rendered output) and a narration-only run (oracle envelope, no fetch) can be represented and attributed correctly. Modify only if isolation cannot be achieved without it."
  - repo: k-12Harness
    path: evals/replay.py
    reason: "Contingent adjustment to project()/RunRecord construction so last_envelope()/evidence_calls() graders read the oracle envelope for narration and do not misfire on intent-only runs. Modify only if required."
  - repo: k-12Harness
    path: tests/unit/test_live_tier.py
    reason: "Extend deterministic offline tests (scripted model) for per-stage execution, narration/intent isolation, per-stage checkpoint/resume, per-stage pass@k/pass^k, quota interruption, and CredentialsRejected-writes-no-report."
  - repo: k-12Harness
    path: tests/live/test_live_eval.py
    reason: "Add manual/credentialed coverage of the three-stage surface; remains live-marked and excluded from the PR gate."
permitted_files:
  - repo: k-12Harness
    path: harness/intent.py
    reason: "No logic change expected; a thin eval-facing helper may be added only if a stage cannot be invoked in isolation from the current signature (ADR-014 one-owner rule)."
  - repo: k-12Harness
    path: harness/narration.py
    reason: "No logic change expected; a thin eval-facing helper may be added only if narration cannot be invoked in isolation. Production narration logic must not move into the eval runner."
  - repo: k-12Harness
    path: harness/answer_view.py
    reason: "No logic change expected; reuse existing build_answer_view. A thin helper only if strictly required for oracle-envelope wiring."
  - repo: work-store
    path: work/20260908T113155/
    reason: "Append-only evidence store for this work item; the controller writes verification logs, capture, and acceptance evidence here."
