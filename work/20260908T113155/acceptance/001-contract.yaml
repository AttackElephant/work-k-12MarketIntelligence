must_not_change:
  - "Any vendored contract file under contract/ (registry, schemas, PINNED.json); the v0.3.0 evidence contract is out of scope and pinned by hash (ADR-008)."
  - "tests/unit/test_contract_pin.py and the contract pin it enforces."
  - "The pass/fail rule of any existing grader in evals/graders.py; only stage-scoped selection may be added (ADR-013)."
  - "Production decision, fetch, rendering-gate, and assembly logic in harness/agent.py, harness/rendering.py, harness/outputs.py; the eval runner must not duplicate or reimplement stage-owner logic (ADR-014)."
  - "Credential/transport semantics: CredentialsRejected stops the suite with no report; a 500/timeout remains an ordinary failed trial; classification stays status-based via classify (ADR-016)."
  - "cost_complete semantics: it requires that something was actually priced, and remains False by design under the claude_account transport (ADR-016, ADR-019)."
  - "The _trial_key = (case_id, phrasing, trial) definition and the checkpoint stage-guard that forbids resuming across a different stage."
  - "The deterministic stub-tier pass/fail rules and golden-case authoring format (beyond any per-stage oracle wiring narration requires)."
failure_behaviour:
  - "On QuotaExceeded during any stage, the runner raises/records SuiteInterruption(kind=quota_exhausted, reset_at=...) and breaks, leaving a resumable checkpoint written atomically after the last completed trial."
  - "On a rejected credential in any stage, run_trial surfaces CredentialsRejected (via classify -> AuthError), main stops at the first occurrence, and no report is written (ADR-016)."
  - "A 500, timeout, or other ordinary error in any stage is recorded as a failed TrialResult, not folded into an infrastructure stop and not scored as a credential/auth failure (ADR-016)."
  - "An intent-only trial performs no evidence fetch and no rendering; a narration-only trial performs no live fetch and narrates over the oracle envelope only. A stage that cannot be executed in isolation must fail loudly rather than silently falling back to the full end-to-end path."
  - "A resume whose recorded stage differs from the requested stage remains rejected rather than silently mixing cross-stage trials."
compatibility:
  - "Live tier stays manual/nightly and never becomes a PR gate; it reports pass@k (capability) and pass^k (reliability) separately for each stage (ADR-007, ADR-015)."
  - "Grading reads the transcript / the envelope the tool actually returned (for narration, the oracle envelope), never the model's account of its own work (ADR-013)."
  - "Limitations render verbatim and the harness assigns no grade; narration and end-to-end grading must continue to enforce this (ADR-009)."
  - "Default (--stage omitted) and end-to-end both keep the current full-loop execution; their only difference remains the k=1 constraint already enforced for end-to-end."
  - "Account-plan (claude_account) usage is reported without a manufactured USD figure; cost_complete remains False there, and spend_usd(deps.last_messages) still applies where a model call occurred (ADR-018, ADR-019)."
compatibility_baselines: []
contract_requirements:
  - "The manifest declares no explicit allowlist for k-12Harness (governance diff-allowlist, scope.declared_files: [], declared: false). The permitted change set is exactly the files in required_outputs plus permitted_files; a change exceeding this set is a scope escape requiring human review, not silent expansion."
  - "CONFLICT (request vs current source): request.md assumes the three stages are executed, but evals/live.py today ships an inert --stage surface (parsed, validated, checkpointed, resume-guarded) whose value never reaches run_suite/run_trial/grading. The work is to wire the existing flag into execution and grading, NOT to add a new flag."
  - "GAP (no defining authority): 'genuinely isolated' stage semantics, oracle-narration input, and per-stage grader sets have no schema/ADR that specifies them exactly. They are interpreted from the request plus ADR-013's transcript/envelope isolation principle and the existing four-stage pipeline; this interpretation is a proposal for human confirmation."
  - "ASSUMPTION (load-bearing, needs owner confirmation): 'isolated narration' means grading against a canonical/oracle envelope per case (the existing case.stub_case fixture) built into an AnswerView, not the model's own fetched envelope. If isolation instead means isolating narration from intent while still performing a live fetch, the wiring differs and the contract must be revised."
  - "GAP (no defining source for operational guarantees): request.md requires 'quota-aware checkpointing, resumability, completed-trial semantics' but docs/decisions.md ADR-016 defines only credential/transport-failure handling; quota-exhaustion signalling and checkpoint format are otherwise undefined and are preserved from current source behaviour as-is."
  - "GAP (provider authority ambiguous): ADR-018 (codex_account) and ADR-019 (claude_account, superseding) both appear in the pack; the governing quota transport is taken to be claude_account per ADR-019, but the exact QuotaExceeded raise site is unconfirmed from available source."
  - "CONSTRAINT (RunRecord shape): evals/schema.RunRecord / evals/replay.project cannot currently represent an intent-only run (no rendered output) or a narration-only run (oracle envelope, no fetch). Any change here must be the smallest that lets existing graders read the oracle envelope for narration and prevents last_envelope()/evidence_calls() misattribution; it must not alter end-to-end RunRecord shape or grading."
semantic:
  - "Isolation (the defining check): a narration-stage trial given a wrong scripted intent scores identically to one given a correct intent, because grounding, limitations_verbatim, confidence_unchanged, and no_forecast_framing all read the oracle envelope, not the intent."
  - "An intent-stage trial is graded only by decision-scoped graders (question_match, request_match, school_resolved_through_directory, clarification_correct, refusal_is_contract_sourced); rendering/grounding graders do not run and no evidence is fetched."
  - "grade_case(..., stage=None) reproduces the current GRADERS_BY_DIRECTION behaviour exactly for end-to-end/default trials, so existing reference solutions and mutations remain load-bearing (ADR-013)."
  - "Per-stage completed-trial accounting: summarise/aggregate/completed_reports count each completed stage-scoped trial exactly once and match a hand-computed trial matrix per stage; pass@k/pass^k are reported separately per stage."
  - "The eval runner reuses the harness's public stage entry points (interpret_intent, build_answer_view, narrate) rather than duplicating decision or render logic (ADR-014)."
out_of_scope:
  - "Changing the v0.3.0 evidence contract, registry, schemas, or PINNED.json (pinned; adoption of a new contract version is a separate deliberate change)."
  - "Production agent decision logic and the four-stage pipeline in harness/agent.py beyond exposing existing entry points for isolated invocation."
  - "The deterministic stub-tier pass/fail rules and the golden-case authoring format, except any per-stage oracle-envelope wiring narration requires."
  - "Adding or redesigning the --stage CLI surface (parsing/validation/checkpoint/resume-guard already exist); the work is wiring the existing value into execution and grading."
  - "Wiring the FastAPI server layer (server/), the demo surface, and any change to live-tier scheduling (it stays manual, never a PR gate)."
  - "Altering _trial_key composition or introducing cross-stage trial mixing on resume."
