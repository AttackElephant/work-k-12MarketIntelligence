        assert "grade: Observed" in lines, "stated grade line missing"; assert "weakest input: Observed"
        in lines, "weakest input line missing"; assert all(a in lines for a in ("forecast: not_applicable",
        "linkage: high", "source: high", "temporal: medium")), "an axis rating is missing"; assert not
