        out.splitlines() if l.strip().startswith("{") and "\"level\"" in l]; log_text = (tmp / "logs"
        / "harness.log").read_text(encoding="utf-8"); assert code == cli.EXIT_UNSUPPORTED, code; assert
        "probe refusal" in out, "outcome not printed"; assert not records, "log records on stdout: %r"
