concerns:
- id: C1
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: where console log records go so that standard output carries only the outcome. No
    document in the Definition Pack takes a position on this. Options: (a) the plan option, which changes
    handlers.console.stream in logging_config.yaml to ext://sys.stderr for every entry point; (b) switch
    console logging off for the command line only, inside run.py, leaving logging_config.yaml unchanged
    and demo.py, evals.live and capture.py still logging to standard output; (c) change the LOG_LEVEL
    default, which the request notes also changes what the log file records and which therefore conflicts
    with must_not_change (log file content, LOG_LEVEL default) and with test_logging_config.py. Affects:
    required_outputs (logging_config.yaml is required under (a) and must not change under (b)), the compatibility
    entry on other entry points, observable_behaviour text-stdout-outcome-only, and the release note summary.
    The criteria text-mode-stdout-carries-no-log-record and json-mode-stdout-is-one-document hold under
    (a) or (b). This version is written on option (a).'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
    decision-console-routing). Put it to the owner; the version that carries the answer reads DECIDED
    (C<n>): where this entry was.'
