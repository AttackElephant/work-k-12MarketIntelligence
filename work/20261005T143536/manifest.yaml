      evidence_sha256: 32f728859b68c142e4dce10583272d0d384080567ec7873d874af9d92b16a50f
      confirmed_by: shane
      label: human confirmation recorded; identity not independently enforced
  dispositioned_at: '2026-10-06T02:18:08Z'
  remediation:
    round: 2
    state: resolved
    rationale: The delta changes the planned text-mode unit test to require stdout to equal exactly `cli.render_text(<the
      Unsupported the fake returned>)` followed by one newline. This rejects arbitrary diagnostics, warnings,
      or other non-log output, and the full-test-suite acceptance criterion executes that test.
- id: PF-2
  origin: planning
  review: PR1
  round: 1
  severity: blocking
  summary: Several deterministic commands cannot satisfy their declared exact stdout match under ordinary
    regex semantics.
  detail: The L01 and VC-POC-13 commands print every confidence line before their success marker; the
    no-grade command prints the blocks; and the text-mode command prints the rendered outcome. Their `expect.stdout_matches`
    values are nevertheless anchored as if the marker were the entire stdout, for example `^L01-BLOCK-OK$`
    and `^TEXT-STDOUT-OK$`. Unless the acceptance runner applies undocumented multiline line-search semantics,
    these checks fail after a correct implementation. The commands should suppress preceding diagnostic
    output or the expectations should explicitly match the complete output using defined matcher semantics.
  required_change: null
  evidence: null
  references:
  - Acceptance contract — deterministic.l01-block-shows-stated-grade
  - Acceptance contract — deterministic.vc-poc-13-block-shows-component-grades
  - Acceptance contract — deterministic.no-stated-grade-shows-ratings-only
  - Acceptance contract — deterministic.text-mode-stdout-carries-no-log-record
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-10-06T02:15:46Z'
  disposition:
    kind: reject
    rationale: 'The finding is mistaken about the matcher: the method''s deterministic runner applies
      stdout_matches with re.search and re.MULTILINE (scripts/run_deterministic.py, evaluate), so the
      anchored success markers match the final line of output after the printed diagnostics, and these
      checks pass after a correct implementation.'
    authorised_by: shane
    at: '2026-10-06T02:18:04Z'
    residual_risk: null
    reference: null
    author:
      kind: model
      name: claude-opus-5-5
