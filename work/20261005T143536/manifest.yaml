findings:
- id: PF-1
  origin: planning
  review: PR1
  round: 1
  severity: blocking
  summary: The text-mode acceptance check permits arbitrary non-log output on stdout.
  detail: The request and observable behaviour `text-stdout-outcome-only` require stdout to contain the
    rendered outcome and nothing else. However, the planned unit test and deterministic command only reject
    lines that look like JSON objects with a `"level"` key and confirm that the refusal text is present.
    An implementation could print diagnostics, warnings, or non-JSON log text to stdout and still pass.
    The test must compare stdout exactly with the expected rendered outcome, as the JSON-mode criterion
    already does.
  required_change: null
  evidence: null
  references:
  - Request — Objective
  - Request — What should happen 3
  - Plan — Proposed changes 3
  - Acceptance contract — observable_behaviour.text-stdout-outcome-only
  - Acceptance contract — deterministic.text-mode-stdout-carries-no-log-record
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-10-06T02:15:46Z'
  disposition:
    kind: remediate
    rationale: 'The finding is right: the objective says standard output holds the outcome and nothing
      else, and the planned text-mode test only rejects JSON log records. The plan''s text-mode test is
      tightened to require standard output to equal exactly the rendered refusal followed by one newline,
      as the JSON-mode test already does, so the full-suite criterion enforces it; the contract stays
      as approved.'
    authorised_by: shane
    at: '2026-10-06T02:18:08Z'
    residual_risk: null
    reference: null
    author:
      kind: model
