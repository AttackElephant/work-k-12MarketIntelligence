findings:
- id: SF-1
  origin: semantic
  review: S1
  round: 1
  severity: blocker
  summary: README and RUNBOOK disagree about what happens when an explicitly resumed checkpoint is incompatible.
  detail: null
  required_change: Make both documents describe the actual `evals/live.py` behavior consistently. If an
    incompatible `--resume` is rejected, replace the README claim that it starts a fresh run with an explicit
    statement that resume is refused and that the operator must initiate a separate fresh run.
  evidence: README.md says that for a report-format, contract-version, model, stage, or saved-selection
    mismatch, “any mismatch starts a fresh run.” RUNBOOK.md instead says such a mismatch “is refused rather
    than silently continued.” These are materially different operator-visible behaviors, and the latter
    is presented as the behavior of the `evals/live.py` referent.
  references: []
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-29T07:57:36Z'
  disposition:
    kind: remediate
    rationale: 'README misstates evals/live.py: an incompatible --resume is refused, not restarted; correct
      README to match the code and RUNBOOK.'
    authorised_by: shane
    at: '2026-09-29T08:01:41Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-29T08:01:41Z'
  remediation:
    round: 2
    state: resolved
    rationale: README.md now states that an incompatible `--resume` is refused with an error and that
      the operator must explicitly start a fresh run without `--resume`. RUNBOOK.md uses the same behavior
      and operator instruction, removing the prior contradiction.
