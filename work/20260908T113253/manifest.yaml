- id: C1
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: which ''checkpoint compatibility rules'' referent the doc surfaces reconcile to.
    Options: (a) the model-checkpoint/resume rule — the pinned account model (config/settings.py CLAUDE_ACCOUNT_MODEL)
    cannot resume a checkpoint produced by another model, per-model cache minimums re-verified on upgrade
    (ADR-006); (b) the eval-resume checkpoint (RUNBOOK §1 `--resume`); (c) the contract hash pin (ADR-008);
    (d) the SDK+framework pin surface (ADR-015-3). Neither Definition Pack reference defines a ''checkpoint''
    concept, so this is an owner choice. The rest of the contract is written on option (a). Affects: semantic
    checkpoint-rule-documented, observable_behaviour runbook-reflects-stages, and RUNBOOK.md / README.md
    content in required_outputs.'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
