    Under the v1.2.0 path classes, any change to a root *.py behaviour path makes the release note `**Type:**
    minor`; a docs-only change (README, RUNBOOK, the note) is `**Type:** patch`. Options: (a) edit run.py/demo.py
    help/docstrings where they name provider/model/eval stages — release note Type: minor, run.py and
    demo.py are in the change set; (b) leave run.py/demo.py untouched — release note Type: patch. The
    contract is written on option (a) (the plan lists run.py/demo.py as in-scope surfaces) but keeps them
    in permitted_files so option (b) needs no restructuring; the release-note-typed deterministic accepts
    either Type. Affects: permitted_files (run.py, demo.py), observable_behaviour no-behaviour-change,
    semantic release-note-type-correct, deterministic release-note-typed.'
