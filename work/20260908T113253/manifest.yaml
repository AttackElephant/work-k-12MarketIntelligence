concerns:
- id: C1
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: which ''checkpoint compatibility rules'' referent the doc surfaces reconcile to.
    Options: (a) the model-checkpoint/resume rule — the pinned account model (config/settings.py CLAUDE_ACCOUNT_MODEL)
    cannot resume a checkpoint produced by another model, per-model cache minimums re-verified on upgrade
    (ADR-006); (b) the eval-resume checkpoint (RUNBOOK §1 `--resume`); (c) the contract hash pin (ADR-008);
    (d) the SDK+framework pin surface (ADR-015-3). Neither Definition Pack reference defines a ''checkpoint''
    concept, so this is an owner choice. The rest of the contract is written on option (a). Affects: semantic
    checkpoint-rule-documented, observable_behaviour runbook-reflects-stages, and RUNBOOK.md / README.md
    content in required_outputs.'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
    decision-checkpoint-referent). Put it to the owner; the version that carries the answer reads DECIDED
    (C<n>): where this entry was.'
  blocking: true
  status: resolved
  opened_at: '2026-09-29T03:15:57Z'
  references:
  - acceptance/001-contract.yaml
  resolution: Live-eval resume rules as implemented in evals/live.py; carried by contract v2 as DECIDED
    (C1)
  resolved_at: '2026-09-29T07:22:20Z'
  decision_entry: decision-checkpoint-referent
  contract_version: 1
  resolved_by: shane
- id: C2
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: whether the reconciliation edits the code entry points (run.py, demo.py) at all.
    Under the v1.2.0 path classes, any change to a root *.py behaviour path makes the release note `**Type:**
    minor`; a docs-only change (README, RUNBOOK, the note) is `**Type:** patch`. Options: (a) edit run.py/demo.py
    help/docstrings where they name provider/model/eval stages — release note Type: minor, run.py and
    demo.py are in the change set; (b) leave run.py/demo.py untouched — release note Type: patch. The
    contract is written on option (a) (the plan lists run.py/demo.py as in-scope surfaces) but keeps them
    in permitted_files so option (b) needs no restructuring; the release-note-typed deterministic accepts
    either Type. Affects: permitted_files (run.py, demo.py), observable_behaviour no-behaviour-change,
    semantic release-note-type-correct, deterministic release-note-typed.'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
    decision-release-note-type). Put it to the owner; the version that carries the answer reads DECIDED
    (C<n>): where this entry was.'
  blocking: true
  status: resolved
  opened_at: '2026-09-29T03:15:57Z'
  references:
  - acceptance/001-contract.yaml
  resolution: 'run.py and demo.py untouched, release note Type: patch; carried by contract v2 as DECIDED
    (C2)'
  resolved_at: '2026-09-29T07:22:26Z'
  decision_entry: decision-release-note-type
  contract_version: 1
  resolved_by: shane
