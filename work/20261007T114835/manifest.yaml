concerns:
- id: C1
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: may the controller''s dry run against base commit 6d3dd93 execute the base test
    suite in place? The base code has no guard, so `full-test-suite` and `usage-log-unchanged-by-suite`,
    run on base, append scripted-model records to the real `logs/usage/`. The plan avoided exactly that
    for its own base check. Options: (a) accept it: the directory is untracked, already contaminated,
    and cleaning it is out of scope; the contract stands as written. (b) no base run may write there:
    both criteria run only on the candidate, and a human records the base result as accepted; or they
    are rewritten to run the suite in an isolated copy of the tree (as `guard-test-fails-on-base-tree`
    does), with the base failure shown by a copy-based count of the copy''s own `logs/usage/`. Affects:
    deterministic `full-test-suite` and `usage-log-unchanged-by-suite`, and observable_behaviour suite-leaves-usage-log-unchanged.
    This contract is written on option (a), because the repository''s declared verify command must be
    run and the plan''s verification step 2 runs the suite in place.'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
    decision-base-dry-run-writes). Put it to the owner; the version that carries the answer reads DECIDED
    (C<n>): where this entry was.'
  blocking: true
  status: resolved
