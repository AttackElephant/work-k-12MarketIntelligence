    step: contract version 2
    state: classified
    method:
      id: coding-harness
      version: 0.23.0
      commit: 7d246d4e581326e13e97a5eb65a0b8952c9d0927
    provider: anthropic
    model: claude-opus-5-5
  authorisation:
    kind: human-confirmation
    decision_sha256: 11bbb99ac2f97dbf3146b64d20281b059a1143152d75e2ce7a558526766534a1
    evidence_sha256: 9c5b31085d9b7af1bfe8ee451727dd0452658e2da68845ed3138b2c8d87180cd
    confirmed_by: shane
    label: human confirmation recorded; identity not independently enforced
- id: C2
  origin_stage: contracting
  raised_by: contract author via DECISION marker; opened by create_contract.py
  summary: 'DECISION: should paid live-tier runs (`tests/live/test_live_eval.py`, run by hand with `-m
    live`) still record usage in the real `logs/usage/`? Options: (a) no: follow ADR-021 literally and
    redirect the module with `usage_log_dir` (the plan''s choice); real-model live-test telemetry then
    no longer lands in `logs/usage/`. (b) yes: exempt live-marked tests from the guard, which needs an
    exemption rule in `tests/conftest.py`, leaves `tests/live/test_live_eval.py` unchanged, and departs
    from ADR-021''s wording. Affects: permitted_files `tests/live/test_live_eval.py`, required_outputs
    `tests/conftest.py` (exemption logic), compatibility ADR-021, and semantic `live-tier-consistent`.
    This contract is written on option (a).'
  detail: 'Marked DECISION: by the contract author in contract v1 (acceptance/001-contract.yaml, entry
    decision-live-tier-usage). Put it to the owner; the version that carries the answer reads DECIDED
    (C<n>): where this entry was.'
  blocking: true
  status: resolved
  opened_at: '2026-10-07T12:14:58Z'
  references:
  - acceptance/001-contract.yaml
  resolution: 'Decided: option (a). Paid live-tier runs follow ADR-021 as written: tests/live/test_live_eval.py
    opts into usage_log_dir, so manual live runs record into a temporary directory and not into logs/usage/.
    Recording live-run spend in the real log would contradict the rank-1 decisions log and would need
    a change to it first, outside this item.'
  resolved_at: '2026-10-07T13:02:41Z'
