observable_behaviour:
  - id: suite-leaves-usage-log-unchanged
    behaviour: "Count the lines in every file under `logs/usage/`, run `.venv/bin/python -m pytest tests/ -q`, then count again. The counts are the same and no new file has appeared in `logs/usage/`."
  - id: guard-stops-unredirected-recording
    behaviour: "While the test suite runs, any call that would make `harness.usage.append_jsonl` write to the real usage directory is stopped before anything is written. This covers a call through `record_run` with no `log_dir`, a direct call with no `log_dir`, and a call with an explicit `log_dir` that resolves to the real directory or to a folder inside it. The calling test fails, and the failure message names the directory it tried to write to."
  - id: guard-demonstrated-by-purpose-written-test
    behaviour: "A new test module, `tests/unit/test_usage_log_guard.py`, shows the guard stopping such a write. Its guard tests fail on the base commit 6d3dd93 with `DID NOT RAISE` and pass on the candidate."
  - id: recording-still-exercised
    behaviour: "Tests that exercise usage recording still record, now into a temporary directory, and still pass. This covers `tests/unit/test_usage.py`, `test_a_budget_trip_still_records_its_usage`, and the legacy tool-loop tests that run with `record_usage=True`. The shared non-autouse `usage_log_dir` fixture in `tests/conftest.py` sends the recorder to `tmp_path / \"usage\"` and returns that path."
  - id: guard-not-a-blanket-block
    behaviour: "A call that passes an explicit temporary `log_dir`, or that runs under the `usage_log_dir` fixture, writes normally. It returns a path inside the temporary directory."
