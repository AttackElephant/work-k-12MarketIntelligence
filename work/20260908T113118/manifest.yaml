concerns:
- id: C1
  origin_stage: planning
  raised_by: planner
  summary: golden_cases.json and the v0.3 specification disagree on an explicitly supplied ACARA ID that
    is absent from the pinned directory
  detail: evals/cases/golden_cases.json treats explicitly supplied ACARA ID 99999 as requiring no directory
    lookup and permits an empty success. contract/POC_CONTRACT_V0.3_SPEC.md classifies an ID absent from
    the pinned directory as bad_request. The two cannot both be satisfied by pre-dispatch directory-membership
    validation. This work item is bounded around the conflict rather than resolving it (contract requirement
    direct-id-authority-conflict, and the matching out_of_scope entry), so it is advisory here. It becomes
    blocking for any work item that enforces directory membership for caller-supplied IDs, and the Definition
    Pack owner must rule before then.
  blocking: false
  status: open
  opened_at: '2026-09-09T07:31:25Z'
  references:
  - planning/001-plan.md
  - acceptance/002-contract.yaml
  - contract/POC_CONTRACT_V0.3_SPEC.md
  - evals/cases/golden_cases.json
  resolution: null
  resolved_at: null
- id: C2
  origin_stage: planning
  raised_by: planner
  summary: the Definition Pack supplies request schemas for only three of the registered questions
  detail: Only VC-POC-01, VC-POC-03 and VC-POC-04 request schemas are captured, so generic local JSON
    Schema validation cannot be applied to every registered question. The plan limits exact schema assertions
    to those three and the contract puts the rest out of scope. Adding the remaining request schemas to
    the Definition Pack is the precondition for full pre-dispatch validation.
  blocking: false
  status: open
  opened_at: '2026-09-09T07:31:25Z'
  references:
