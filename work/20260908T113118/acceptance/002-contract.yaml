  - source: "contract/poc_question_registry.v0.3.0.json"
    revision: "sha256:3bea2093b2e900ecf7b27528aaad1dcec93f11791dd87ccf85c67f73f588b7cb"
    obligation: "Use the registered input_policy, availability, selector constraints, metric lists, and preflight boundaries."
  - source: "contract/question_schemas/v0.3.0/_index.json"
    revision: "sha256:e5b9877ffeb14e436433ebbc894de62a4bf8022324b9a33cfc80f4538d09bb1d"
    obligation: "Preserve required, material, conditional-material, defaultable, optional, and gated classifications."
