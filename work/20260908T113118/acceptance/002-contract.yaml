contract_version: 0.1.0
artifact_version: 1
work_item: "20260908T113118"
observable_behaviour:
  - id: planner-derived-inputs
    behaviour: "The planner derives absent required, material, and applicable conditional-material inputs from the pinned question input_policy and the request values actually present or safely derivable; it does not trust StructuredIntent.missing_material_inputs as authoritative."
  - id: conditional-distance
    behaviour: "For VC-POC-05, VC-POC-06, and VC-POC-07, distance_km is missing only when market_definition is distance; non-distance market definitions do not require it."
  - id: omit-unsupplied-defaults
    behaviour: "Defaultable fields, including year ranges and default metric or ratio selections, remain absent from the submitted request unless explicitly supplied by the user."
  - id: stable-clarification
    behaviour: "Genuinely absent user-selectable inputs return ClarificationNeeded in pinned policy order, using contract field names and catalog-backed allowed values where available, without calling fetch_evidence."
  - id: safe-school-resolution
    behaviour: "Every named school must produce exactly one directory record before evidence dispatch; zero or multiple matches return clarification and do not select a candidate."
  - id: transactional-school-resolution
    behaviour: "Named schools are resolved as one logical preflight: IDs are accumulated locally in mention order, deduplicated without reordering, and committed to Deps only after all mentions resolve successfully."
  - id: selector-shape
    behaviour: "Single-school questions submit exactly one acara_sml_id; multi-school questions submit ordered unique acara_sml_ids; VC-POC-04 requires at least two distinct IDs."
  - id: identity-conflict
    behaviour: "Explicit acara_sml_id or acara_sml_ids values must agree with identities resolved from school mentions; disagreement fails before evidence dispatch."
  - id: metric-normalization
    behaviour: "Requested metric labels are case-folded and separator-normalized, canonical values pass through unchanged, and only explicitly authorised semantic aliases are applied, including teaching staff to teaching_fte."
  - id: metric-routing
    behaviour: "VC-POC-01 and VC-POC-04 use profile_metrics and submit metrics; VC-POC-03 uses ratios and submits ratios with no metrics property; VC-POC-11 uses student_context_metrics and submits metrics."
  - id: metric-scope
    behaviour: "Normalized selectors are validated against the applicable closed catalog vocabulary, deduplicated while preserving user order, and subject to the existing headcount and non-teaching restrictions before request construction."
  - id: exact-request
    behaviour: "The evidence request is freshly constructed from explicit intent filters and only the planner-owned selector appropriate to the question, without presentation metadata, inferred defaults, stale dependency state, or unrelated fields."
  - id: bad-request-failure
    behaviour: "An emitter bad_request reached through deterministic planning records the failed fetch_evidence invocation and raises TerminalError with question and emitter context; it never returns Unsupported."
required_outputs:
  - path: "harness/planner.py"
    result: "Deterministic input derivation, transactional school resolution, metric normalization and routing, exact request construction, and fail-closed bad_request handling."
  - path: "tests/unit/test_planner.py"
    result: "Focused unit coverage for input policy, school resolution, selector conflicts and cardinality, catalog normalization, exact requests, and all evidence-error branches."
  - path: "tests/unit/test_intent_boundary.py"
    result: "Pipeline coverage proving planner clarification bypasses answer-view and narration, normalized requests reach evidence, and planner bad_request propagates as failure."
deterministic:
  - id: full-test-suite
    repo: "/Users/shane/Projects/k-12Harness"
    command: ".venv/bin/python -m pytest tests/ -q"
    expected: "The complete deterministic test suite exits with status 0 and reports no failed or unexpectedly passed tests."
  - id: planner-focused-suite
    repo: "/Users/shane/Projects/k-12Harness"
    command: ".venv/bin/python -m pytest tests/unit/test_planner.py tests/unit/test_intent_boundary.py -q"
    expected: "Both focused test modules exit with status 0, covering planner behaviour and pipeline propagation."
  - id: school-resolution-checks
    repo: "/Users/shane/Projects/k-12Harness"
    command: '.venv/bin/python -m pytest tests/unit/test_planner.py -q -k "school or identity or duplicate or conflict"'
    expected: "Selected tests pass and demonstrate unique resolution, clarification for zero or multiple matches, ordered deduplication, selector cardinality, conflict rejection, and no evidence fetch after failed preflight."
  - id: input-policy-checks
    repo: "/Users/shane/Projects/k-12Harness"
    command: '.venv/bin/python -m pytest tests/unit/test_planner.py tests/unit/test_intent_boundary.py -q -k "material or distance or clarification or default"'
    expected: "Selected tests pass and demonstrate policy-derived missing inputs, conditional distance_km materiality, stable clarification, omitted defaults, and clarification bypass of downstream answer stages."
  - id: metric-and-request-checks
    repo: "/Users/shane/Projects/k-12Harness"
    command: '.venv/bin/python -m pytest tests/unit/test_planner.py tests/unit/test_intent_boundary.py -q -k "metric or ratio or exact_request or normalization"'
    expected: "Selected tests pass and assert canonical passthrough, case and separator normalization, teaching-staff aliasing, stable deduplication, question-specific vocabularies, VC-POC-03 ratios routing, and exact request dictionaries for VC-POC-01, VC-POC-03, and VC-POC-04."
  - id: error-semantics-checks
    repo: "/Users/shane/Projects/k-12Harness"
    command: '.venv/bin/python -m pytest tests/unit/test_planner.py tests/unit/test_intent_boundary.py -q -k "bad_request or unanswerable or unknown or excluded or gated or data_unavailable or internal"'
    expected: "Selected tests pass; bad_request raises TerminalError with a retained invocation, while unknown, excluded, gated, unanswerable, data_unavailable, and internal preserve their specified outcomes."
must_not_change:
  - "The legacy PydanticAI agent-tool repair loop and its configured repair ceiling."
  - "Evidence-contract files, pinned hashes, request or response schemas, registry contents, and input-catalog snapshot."
  - "The evidence client protocol, deterministic data emitter, database access, or evidence calculation."
  - "Answer-view construction, narration, rendering, grounding, confidence, limitations, or claim-eligibility behaviour."
  - "Contract-owned exclusion wording or gated-question refusal wording."
  - "The prohibition on School_No to ACARA_SML_ID crosswalks."
failure_behaviour:
  - condition: "A named school returns no directory records."
    expected: "Return ClarificationNeeded identifying the unresolved school; do not mutate resolved IDs or call fetch_evidence."
  - condition: "A named school returns more than one directory record."
    expected: "Return ClarificationNeeded identifying the ambiguous school; do not choose the first candidate, mutate resolved IDs, or call fetch_evidence."
  - condition: "Resolved school identities disagree with explicit acara_sml_id or acara_sml_ids filters."
    expected: "Fail closed before fetch_evidence and retain no partial identity update in Deps."
  - condition: "Deduplication leaves fewer than two schools for VC-POC-04."
    expected: "Return clarification without evidence dispatch."
  - condition: "A requested selector cannot be normalized into the applicable static closed vocabulary."
    expected: "Fail before evidence dispatch and do not reinterpret the condition as an unsupported user question."
  - condition: "The emitter returns bad_request after deterministic planning."
    expected: "Append the failed fetch_evidence ToolInvocation and raise TerminalError containing the question ID and emitter error context."
  - condition: "The emitter returns unknown_question."
    expected: "Return the existing Unsupported not_in_registry outcome."
  - condition: "The emitter returns excluded_question."
    expected: "Return the existing contract-owned Unsupported outcome with its reason code and message."
  - condition: "The emitter returns unanswerable."
    expected: "Return the existing Unsupported unanswerable outcome without retry."
  - condition: "The emitter returns data_unavailable or internal."
    expected: "Raise TerminalError as an operational failure."
compatibility:
  - "Existing excluded-topic, registry-owned exclusion, gated-question, and unknown-question branches retain their typed Unsupported outcomes and contract-owned text."
  - "Valid registered requests that are factually unanswerable retain the unanswerable abstention."
  - "Successful evidence envelopes continue to be returned unchanged and stored in deps.last_envelope."
  - "All school-directory and input-catalog preflights and evidence invocations remain observable in deps.tool_calls."
  - "The deterministic planner's TerminalError treatment of bad_request is intentionally distinct from the legacy model-driven tool loop, which may repair and retry."
  - "Release-derived and open vocabulary values remain type-and-shape constrained rather than being incorrectly enforced as static catalog enums."
