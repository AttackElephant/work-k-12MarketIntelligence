    obligation: "Preserve existing answer, clarification, refusal, gated, empty-success, and injection-resistance expectations except where this work item explicitly strengthens deterministic planning."
contract_requirements:
  - id: pinned-policy-authority
    requirement: "Planner decisions must be derived from the pinned v0.3 registry, index, input-catalog mapping, and supplied request schemas rather than a new hand-maintained question policy."
  - id: policy-order
    requirement: "Missing-input output must be stable across runs and ordered according to the pinned required, material, and applicable conditional-material declarations."
  - id: known-condition-only
    requirement: "The only descriptive conditional-material expression implemented by this work item is distance_km when market_definition equals distance; any new condition form requires Definition Pack escalation."
  - id: no-invented-defaults
    requirement: "The planner must not add values from input_policy.defaultable when absent; the emitter remains the owner of defaults and resolved_request."
  - id: preflight-boundary
    requirement: "School-directory records establish current ACARA identity only and must not be used as campus, catchment, geography-crosswalk, or School_No evidence."
  - id: exact-schema-coverage
    requirement: "Exact schema-shaped request assertions are mandatory for VC-POC-01, VC-POC-03, and VC-POC-04, the request schemas supplied in this Definition Pack."
  - id: direct-id-authority-conflict
    requirement: "The golden case permits explicitly supplied ACARA ID 99999 to bypass directory lookup and yield an empty success, while the v0.3 specification classifies an ID absent from the pinned directory as bad_request. This work item must preserve explicit numeric IDs without new directory-membership validation until the Definition Pack resolves the conflict."
  - id: error-boundary-refinement
    requirement: "Although the general v0.3 error table permits a model-driven harness to repair bad_request, this deterministic planner has no repair model; therefore a received bad_request is a planner or intent-boundary failure and must raise TerminalError rather than become Unsupported."
semantic:
  - id: no-model-missing-input-trust
    criterion: "A VC-POC-05 intent without market_definition clarifies even when missing_material_inputs is empty, and an irrelevant model-reported missing field is ignored."
  - id: conditional-materiality
    criterion: "A VC-POC-05 SA2 request does not ask for distance_km, while a distance request without distance_km does."
  - id: exact-school-identity
    criterion: "Each school mention contributes an ID only after exactly one match; mention order is preserved, duplicates are removed, and partial resolution cannot leak into request or dependency state."
  - id: exact-metric-meaning
    criterion: 'For VC-POC-01, ["Total Enrolments", "teaching staff"] becomes ["total_enrolments", "teaching_fte"] without adding headcount or non-teaching metrics.'
  - id: exact-ratio-routing
    criterion: "A staffing-intensity selector for VC-POC-03 becomes an allowed ratios array, and the evidence request contains no metrics property."
  - id: exact-comparison-request
    criterion: "A VC-POC-04 dispatch contains only ordered unique acara_sml_ids, explicitly requested canonical metrics, and any other explicitly supplied schema fields; year defaults remain omitted."
  - id: no-user-blame-for-planner-defect
    criterion: "No deterministic planner defect, selector-shape defect, identity conflict, or emitter bad_request is rendered as an out-of-scope or otherwise Unsupported user question."
out_of_scope:
  - "Generic local JSON Schema validation for every registered question when its request schema is not supplied in this Definition Pack."
  - "Support for conditional-material expressions beyond distance_km when market_definition equals distance."
  - "General natural-language synonym inference beyond mechanical case and separator normalization and aliases explicitly authorised by pinned rules."
  - "Directory-membership validation of caller-supplied numeric ACARA IDs while the golden-case and v0.3 specification conflict remains unresolved."
  - "Fuzzy school matching, candidate ranking, confidence scoring, or automatically selecting among ambiguous directory records."
  - "Changes to the legacy agent-tool bad_request repair-and-retry behaviour."
  - "Changes to the evidence contract, emitter, database, narration, answer view, rendering, graders, or presentation layer."
  - "New evidence capabilities, data sources, crosswalks, catchments, campus locations, transport, finance, capacity, outcomes, or forecasts."
