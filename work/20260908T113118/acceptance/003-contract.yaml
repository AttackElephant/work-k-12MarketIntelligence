contract_requirements:
  - id: manifest-allowlist-conflict
    requirement: "The amended plan requires run.py and tests/unit/test_run_cli.py, but manifest scope.declared_files lists only harness/planner.py, tests/unit/test_intent_boundary.py, and tests/unit/test_planner.py. Execution must not begin until the human reviewer expands the manifest diff allowlist to include the two additional required outputs."
  - id: pinned-policy-authority
    requirement: "Planner policy and schema routing must come from hash-pinned v0.3 artefacts, not a new hand-maintained per-question policy."
  - id: complete-schema-validation
    requirement: "Every constructed request for every registered question must validate against its registered pinned Draft 2020-12 request schema before dispatch, including additionalProperties, nested keys, types, bounds, uniqueness, cardinality, conditionals, and formats."
  - id: safe-schema-resolution
    requirement: "Only registered request-schema paths beneath the pinned contract directory may be loaded; load or reference-resolution failures are TerminalError."
  - id: policy-order
    requirement: "Clarification fields are stable across runs and follow pinned required, material, then applicable conditional-material order."
  - id: known-condition-only
    requirement: "Only the exact pinned distance_km condition for VC-POC-05/06/07 is interpreted; an unknown conditional expression is contract drift and raises TerminalError."
  - id: no-invented-defaults
    requirement: "Unsupplied defaultable values are omitted so the emitter remains owner of defaults and resolved_request."
  - id: preflight-boundary
    requirement: "A school-directory record establishes identity only and supplies no campus, catchment, geography-crosswalk, or School_No evidence."
  - id: static-vocabulary-source
    requirement: "Static selector routing uses registry metric_list and the input-catalog schema's question-field mapping and embedded enums; it does not call the runtime emitter for contract-static lists."
  - id: direct-id-authority-conflict
    requirement: "golden_cases.json permits explicit ACARA ID 99999 to bypass directory lookup and yield empty success, while the v0.3 specification says an ID absent from the pinned directory is bad_request. Preserve the plan's bounded resolution: do not add directory preflight for caller-supplied numeric IDs, and treat a resulting bad_request as identity clarification until the Definition Pack owner resolves the conflict."
  - id: od07-explicit-filter-rule
    requirement: "Enforce the registry-owned VC-POC-09/10 explicit-filter constraint in addition to JSON Schema without creating a general condition language."
  - id: invocation-recording
    requirement: "Record every completed directory preflight and every evidence attempt, including failed attempts, before returning or raising."
semantic:
  - id: no-model-missing-input-trust
    criterion: "VC-POC-05 without market_definition clarifies even when the model reports no missing input, and irrelevant model-reported missing fields are ignored."
  - id: conditional-materiality
    criterion: "An SA2 market request does not ask for distance_km, while a distance market without distance_km does."
  - id: transactional-identity
    criterion: "Each school contributes an ID only after exactly one match; mention order is preserved, duplicates are removed, and a later failed match leaks no partial state or request."
  - id: exact-profile-normalization
    criterion: "For VC-POC-01, Total Enrolments and teaching staff become total_enrolments and teaching_fte without adding headcount or non-teaching metrics."
  - id: exact-ratio-routing
    criterion: "VC-POC-03 staffing-intensity selectors use the ratios vocabulary and ratios request field, with no metrics property."
  - id: exact-comparison-request
    criterion: "VC-POC-04 dispatch contains ordered unique IDs, explicitly requested canonical metrics, and only other explicitly supplied schema fields; emitter-owned year defaults remain omitted."
  - id: schema-and-filter-fail-closed
    criterion: "Unknown top-level or nested properties, invalid shapes, and impossible planner-produced requests fail before dispatch; VC-POC-09/10 missing or default-only cohort definitions clarify."
  - id: bad-request-origin
    criterion: "Caller-correctable identity problems clarify, while planner defects and unexpected post-validation bad_request responses fail operationally; neither is rendered as an unsupported question."
  - id: production-routing
    criterion: "run.py main does not call build_agent for its default execution and passes None to converse, while tests that pass an explicit agent continue to use the legacy path."
out_of_scope:
  - "Re-parsing raw natural language in Stage 2; determinism is defined for identical StructuredIntent values."
  - "Conditional-material expressions beyond the exact pinned distance_km condition."
  - "General synonym inference beyond mechanical normalization and explicitly pinned aliases."
  - "Directory-membership preflight for caller-supplied numeric ACARA IDs while the Definition Pack conflict remains unresolved."
  - "Fuzzy school matching, ranking, match confidence, or selecting among ambiguous records."
  - "A new batch directory protocol."
  - "Changes to the legacy agent-tool repair loop or its output semantics."
  - "Changes to contract artefacts, the emitter, database, answer view, narration, rendering, graders, or presentation semantics."
  - "New evidence capabilities, sources, crosswalks, catchments, campus locations, transport, finance, capacity, outcomes, or forecast execution."
