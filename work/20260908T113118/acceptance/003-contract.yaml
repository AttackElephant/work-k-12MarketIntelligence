contract_version: 0.1.0
artifact_version: 1
work_item: "20260908T113118"
observable_behaviour:
  - id: planner-derived-inputs
    behaviour: "The deterministic planner derives absent required, material, and applicable conditional-material inputs from the pinned question policy and assembled request, independently of StructuredIntent.missing_material_inputs."
  - id: conditional-distance
    behaviour: "For VC-POC-05, VC-POC-06, and VC-POC-07, distance_km is required only when market_definition is distance."
  - id: safe-transactional-school-resolution
    behaviour: "Each named school must resolve to exactly one directory record; IDs are staged in mention order, deduplicated without reordering, and committed to Deps only after all mentions resolve."
  - id: exact-selector-shapes
    behaviour: "Single-school questions submit one acara_sml_id; multi-school questions submit ordered unique acara_sml_ids; VC-POC-04 requires at least two distinct IDs."
  - id: metric-normalization-routing
    behaviour: "Requested selectors are Unicode-safe case-folded and separator-normalized, canonical values and pinned aliases are accepted, order-preserving deduplication is applied, and selectors are routed to the question-specific field and static vocabulary."
  - id: smallest-schema-valid-request
    behaviour: "The planner constructs a fresh request from explicit intent values and the applicable planner-owned selectors, omits unsupplied defaults, and validates it against the registered pinned request schema before evidence dispatch."
  - id: explicit-filter-constraints
    behaviour: "VC-POC-09 and VC-POC-10 require an explicit cohort-defining filter: absent, empty, or sector-default-only definitions clarify, while unknown nested keys fail before dispatch."
  - id: bad-request-origin-separation
    behaviour: "Unnormalizable user selectors and invalid caller-supplied numeric identities clarify; planner/schema defects and unexpected bad_request responses after deterministic validation raise TerminalError; none becomes Unsupported."
  - id: default-cli-pipeline
    behaviour: "The default CLI invokes converse with no legacy agent so that ask(deps, question) executes the four-stage deterministic pipeline, while explicit legacy-agent callers remain supported."
required_outputs:
  - path: "harness/planner.py"
    result: "Deterministic policy derivation, transactional identity resolution, static selector normalization and routing, pinned-schema validation, exact request construction, explicit-filter enforcement, and origin-aware error handling."
  - path: "run.py"
    result: "Default CLI wiring selects the deterministic pipeline without constructing or passing a legacy agent."
  - path: "tests/unit/test_planner.py"
    result: "Focused coverage of input derivation, school resolution, selector normalization, all-question schema validation, explicit-filter constraints, exact requests, and error-origin semantics."
  - path: "tests/unit/test_intent_boundary.py"
    result: "Pipeline coverage proving clarification bypasses narration, validated requests reach evidence, and planner failures propagate without becoming Unsupported."
  - path: "tests/unit/test_run_cli.py"
    result: "CLI coverage proving the default path does not build or pass a legacy agent and selects the deterministic pipeline signature."
deterministic:
  - id: full-test-suite
    repo: k-12Harness
    command: ".venv/bin/python -m pytest tests/ -q"
    expected: "The complete deterministic suite exits zero with no failures and no unexpected passes."
    expect:
      exit_code: 0
      stdout_excludes: "xpassed"
  - id: affected-modules
    repo: k-12Harness
    command: ".venv/bin/python -m pytest tests/unit/test_planner.py tests/unit/test_intent_boundary.py tests/unit/test_run_cli.py -q"
    expected: "All affected test modules collect and pass."
    expect:
      exit_code: 0
      stdout_excludes: "failed"
  - id: focused-nonvacuous-acceptance
    repo: k-12Harness
    command: ".venv/bin/python -m pytest -q tests/unit/test_planner.py::test_missing_market_definition_is_derived_without_model_hint tests/unit/test_planner.py::test_distance_is_conditional_on_distance_market tests/unit/test_planner.py::test_ambiguous_school_clarifies_without_fetch tests/unit/test_planner.py::test_metric_normalization_and_exact_profile_request tests/unit/test_planner.py::test_vc_poc_03_routes_selector_to_ratios tests/unit/test_planner.py::test_unknown_request_property_fails_before_fetch tests/unit/test_planner.py::test_peer_filters_require_explicit_nondefault_filter tests/unit/test_planner.py::test_segment_filters_reject_unknown_nested_key tests/unit/test_planner.py::test_schema_valid_emitter_bad_request_is_terminal tests/unit/test_planner.py::test_invalid_explicit_identity_bad_request_clarifies tests/unit/test_intent_boundary.py::test_planner_failure_is_not_unsupported tests/unit/test_run_cli.py::test_main_uses_pipeline_path_by_default"
    expected: "Every named acceptance test exists, collects, and passes; a missing or renamed test makes the command fail."
    expect:
      exit_code: 0
      stdout_excludes: "failed"
must_not_change:
  - "The legacy PydanticAI agent-tool repair loop, its repair ceiling, and its replay compatibility behaviour."
  - "Evidence-contract files, PINNED.json, registry contents, request or response schemas, and the captured input-catalog snapshot."
  - "The evidence client protocol, runtime emitter, database access, or evidence calculations."
  - "Answer-view, narration, rendering, grounding, confidence, limitations, claim eligibility, or contract-owned refusal wording."
  - "The prohibition on School_No to ACARA_SML_ID crosswalks."
  - "contract.material_inputs_for() and the unchanged legacy O-8 strict xfail."
failure_behaviour:
  - condition: "A named school has zero or multiple directory matches."
    expected: "Return ClarificationNeeded for that school, record the preflight, make no evidence call, and retain no partial resolved-ID mutation."
  - condition: "Explicit school IDs conflict with name-resolved identities."
    expected: "Raise TerminalError before evidence dispatch and retain no partial identity update."
  - condition: "Deduplication leaves fewer than two identities for VC-POC-04."
    expected: "Return ClarificationNeeded without evidence dispatch."
  - condition: "A required or applicable material user-selectable field is absent."
    expected: "Return ClarificationNeeded in stable pinned-policy order, with contract field names and static allowed values where available, without evidence dispatch."
  - condition: "A requested static selector cannot be normalized to the applicable pinned vocabulary."
    expected: "Return ClarificationNeeded with the applicable static vocabulary and make no evidence call."
  - condition: "A planner-built request violates its registered schema, contains an unknown top-level or nested field, or cannot load or resolve its pinned schema safely."
    expected: "Raise TerminalError before evidence dispatch; do not return Unsupported."
  - condition: "VC-POC-09 or VC-POC-10 lacks an explicit nondefault cohort-defining filter."
    expected: "Return ClarificationNeeded without evidence dispatch."
  - condition: "A locally validated request containing only a caller-supplied numeric ACARA identity receives bad_request."
    expected: "Record the failed fetch invocation and return identity clarification."
  - condition: "Any other locally validated deterministic request receives bad_request."
    expected: "Record the failed fetch invocation and raise TerminalError containing the question ID and emitter context."
  - condition: "The emitter returns unknown_question, excluded_question, or unanswerable."
    expected: "Preserve the established typed abstention and contract-owned reason semantics without retry."
  - condition: "The emitter returns data_unavailable or internal."
    expected: "Raise TerminalError as an operational failure."
compatibility:
  - "Excluded-topic, registry-owned exclusion, gated-question, unknown-question, and unanswerable outcomes retain their established typed outcomes and contract-owned text."
  - "Successful complete, partial, and empty envelopes remain successful and are stored unchanged in deps.last_envelope."
  - "Well-typed release-derived and open values that match no facts remain successful empty or partial results, not schema failures."
  - "Every directory preflight and evidence invocation, including failed invocations, remains observable in deps.tool_calls."
  - "The deterministic planner's TerminalError handling remains distinct from the legacy model-driven repair-once loop."
  - "converse() continues to accept an explicit legacy agent for replay and compatibility tests."
  - "CLI credential selection, emitter selection, rendering, clarification limit, and exit-code behaviour remain unchanged."
