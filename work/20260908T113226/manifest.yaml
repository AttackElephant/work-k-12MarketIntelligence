findings:
- id: SF-1
  origin: semantic
  review: S1
  round: 1
  severity: blocker
  summary: RequestUsage.details contains non-model-keyed top-level usage entries.
  detail: null
  required_change: Remove the `usage.*` entries from `RequestUsage.details`; keep the top-level counts
    only in the aggregate RequestUsage fields, and populate details solely with integer count entries
    keyed by actual names from `modelUsage`. Update the test and documentation/docstring accordingly.
  evidence: In harness/claude_account_cli.py, `_request_usage` adds `usage.input_tokens`, `usage.output_tokens`,
    `usage.cache_read_tokens`, and `usage.cache_write_tokens` whenever the top-level usage block is present.
    `usage` is not a model name, so these entries do not satisfy the required “model-name-keyed” per-model
    breakdown. The new helper-model test explicitly asserts these extra entries, thereby encoding behavior
    contrary to the semantic criterion rather than detecting it.
  references: []
  work_package: null
  regression: false
  carried_into: null
  status: dispositioned
  raised_at: '2026-09-27T13:47:26Z'
  disposition:
    kind: reject
    rationale: Contract v2 failure_behaviour requires the parser to record both the modelUsage per-model
      counts and the top-level usage block in details for auditability; per-model-recorded and per-model-details
      require model-name-keyed per-model entries, not that details holds nothing else; DECIDED C2 fixed
      the storage location, not exclusivity. The usage.* entries are integer-only and fixed-prefixed,
      carry no raw text or credential, and removing them would violate the contract.
    authorised_by: shane
    at: '2026-09-27T13:49:24Z'
    residual_risk: null
    reference: null
  dispositioned_at: '2026-09-27T13:49:24Z'
