- id: C2
  origin_stage: contracting
  raised_by: operator
  summary: 'DECISION: how per-model (helper-model) usage is recorded. Options: (a) integer-only, model-name-keyed
    entries in RequestUsage.details with no schema change (the option the plan takes and this contract
    is written on); (b) a first-class per-model column via an LlmRequestRecord SCHEMA_VERSION bump. Affects:
    required_outputs (option (b) adds harness/usage.py and its migration and enforcing tests), must_not_change
    (the SCHEMA_VERSION=1 invariant), semantic per-model-details, observable_behaviour per-model-recorded.'
  detail: null
