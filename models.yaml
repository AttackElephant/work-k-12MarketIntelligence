# Executor tiers route through Claude Code as the governed edit transport. `edit_tools`
# keeps the default file tools and adds one scoped shell rule: the component's own
# verification entry point (k-12Harness/.method.yaml: verify), so the executor can run
# focused checks before it returns. No other shell command is permitted. The harness's
# deterministic verification still runs independently afterwards and is the authority.
executor_ladder:
- tier: T0
  provider: anthropic
  model: claude-sonnet-5
  transport: claude
  edit_tools: [Read, Edit, Write, Grep, Glob, 'Bash(.venv/bin/python -m pytest *)']
  model_class: executor
  billing: subscription
  context_window: 200000
  effort: medium
  timeout_seconds: 1200
  deadline_seconds: 1260
  transient_retries: 3
  last_verified: '2026-09-23'
- tier: T1
  provider: anthropic
  model: claude-sonnet-5
  transport: claude
  edit_tools: [Read, Edit, Write, Grep, Glob, 'Bash(.venv/bin/python -m pytest *)']
